# ---------------------------------------------------------------------------
# Order book scraper configuration
# ---------------------------------------------------------------------------

general:
  # How data is recorded:
  #   grid   -> sample the current book every interval_ms  -> snapshots table
  #   stream -> write every incoming update as it arrives  -> book_updates table
  #   both   -> both at once, into their two separate tables
  #
  # grid gives rows that are time-aligned across exchanges, so ts_grid is a
  # direct join key. stream keeps the exact arrival time of every update but
  # needs resampling before exchanges can be compared.
  mode: stream

  # Record executed trades (the tape) as well. Independent of `mode`: a trade
  # is an event that either happened or did not, so there is no grid concept -
  # every trade is written as it arrives, into the `trades` table.
  #
  # `side` there is always the AGGRESSOR (taker) side, normalised across
  # exchanges; `raw_side` keeps whatever the exchange originally sent.
  trades: true

  # Canonical BASE/QUOTE spelling. Translating into each exchange's own
  # spelling (ETHUSDC, ETH-USDC, ETH_USDC, ...) is the adapter's job.
  symbols:
    - "ETH/USDC"
    - "ETH/USDT"
    - "BTC/USDC"
    - "STRK/USDC"
    - "SOL/USDC"

  # Sampling grid in milliseconds. The WebSocket runs at the exchange's own
  # cadence; this sets how often the current book state is written out. All
  # exchanges are sampled on the same grid.
  #
  # 100ms is the sensible lower bound: Binance, OKX, Bitget, Bybit, KuCoin and
  # Gate push at that rate. MEXC (500ms), BingX (~600ms) and HTX (1000ms) push
  # more slowly, so their rows repeat accordingly - recognisable by an
  # unchanged seq and a rising age_ms.
  interval_ms: 100

  # Desired order book depth per side.
  depth: 20

  # What to do when an exchange does not offer exactly this depth?
  #   at_least  -> next larger supported tier (default)
  #   at_most   -> next smaller tier
  #   nearest   -> closest tier
  depth_policy: at_least

  # ws   -> WebSocket only
  # rest -> REST polling only
  # auto -> prefer WebSocket, fall back to REST on persistent failure
  transport: auto

  log_level: INFO

storage:
  backend: sqlite
  path: ./data/orderbook.db
  batch_size: 200
  flush_interval_ms: 1000
  queue_maxsize: 20000

  # Do not write a row when the book has not changed since the last one for
  # that exchange/symbol. Information-preserving: a missing row means "same as
  # the previous one", so forward-fill when analysing. At a 100ms grid this
  # removes roughly half of all rows, because HTX, MEXC and BingX push far
  # more slowly than we sample.
  skip_unchanged: true

  # ... but write at least one row per symbol per this many seconds even when
  # nothing changed. Keeps gaps unambiguous (a longer gap means something was
  # genuinely wrong, not just a quiet market) and bounds how far you ever
  # forward-fill. 0 disables it.
  heartbeat_s: 60

connection:
  # Measures the latency of all known WS endpoints of an exchange at startup
  # and connects to the fastest one.
  pick_fastest_endpoint: true
  latency_probe_timeout_s: 5
  latency_probe_rounds: 2
  # Periodic re-evaluation (0 = off). The endpoint is only switched on a clear
  # improvement, so the connection is not rebuilt constantly.
  relatency_interval_s: 3600
  relatency_improvement_pct: 25

  reconnect_backoff_min_s: 1
  reconnect_backoff_max_s: 60
  # transport: auto only - if the WebSocket fails this many times in a row
  # (e.g. because an exchange changed its protocol), the adapter switches to
  # REST polling for rest_fallback_duration_s and then retries the WebSocket.
  # That way the dataset never breaks off.
  ws_failures_before_rest: 3
  rest_fallback_duration_s: 600
  # If no update arrives for this long, the book counts as stale -> forced
  # reconnect.
  stale_after_s: 15
  # Write stale snapshots anyway (with the stale flag set)? true is
  # recommended: it keeps gaps traceable inside the dataset.
  record_stale_snapshots: true
  ws_ping_interval_s: 20
  rest_timeout_s: 10
  # Status report to the log, every N seconds (0 = off).
  health_report_interval_s: 60

# Overridable per exchange: enabled, depth, transport, ws_endpoints,
# symbol_override (canonical -> native), rest_interval_ms
exchanges:
  binance:  { enabled: true }
  okx:      { enabled: true }
  bybit:    { enabled: true }
  bitget:   { enabled: true }
  kucoin:   { enabled: true }
  gate:     { enabled: true }
  htx:      { enabled: true }
  coinbase: { enabled: true }
  bingx:    { enabled: true }
  # MEXC runs over the protobuf WebSocket (see exchanges/_protobuf.py). If that
  # fails, the REST fallback above kicks in automatically.
  mexc:     { enabled: true }
